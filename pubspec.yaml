name: app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  another_flutter_splash_screen: ^1.2.1
  flutter_launcher_icons: ^0.14.4
  flutter_dotenv: ^6.0.0
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  geolocator: ^14.0.2
  shared_preferences: ^2.5.4
  flutter_islamic_icons: ^1.0.2
  easy_localization: ^3.0.8
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  persistent_bottom_nav_bar_v2: ^6.3.2
  font_awesome_flutter: ^11.0.0
  shimmer: ^3.0.0
  weather_icons: ^3.0.0
  geocoding: ^4.0.0
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^21.0.0
  permission_handler: ^11.3.1
  quran: ^1.4.1
  flutter_speed_dial: ^7.0.0
  audioplayers: ^6.6.0
  islamic_azkar: ^0.0.2
  flutter_timezone: ^5.0.2


  qcf_quran_lite: ^0.0.3
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/imgs/appIcon.png"
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/imgs/appIcon.png"

flutter:
  uses-material-design: true

  assets:
    - ".env"
    - assets/imgs/
    - assets/fonts/
    - lib/core/translation/
    - assets/sounds/
  fonts:
    - family: Digital-7
      fonts:
        - asset: assets/fonts/digital-7.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Hafs
      fonts:
        - asset: assets/fonts/KFGQPC Uthmanic Script HAFS Regular.otf
    - family: QCF_P000
      fonts:
        - asset: assets/fonts/QCF_P000.ttf
    - family: ReemKufi 
      fonts:
        - asset: assets/fonts/ReemKufi-Regular.ttf
          weight: 400 
        - asset: assets/fonts/ReemKufi-Medium.ttf
          weight: 500 
        - asset: assets/fonts/ReemKufi-SemiBold.ttf
          weight: 600 
        - asset: assets/fonts/ReemKufi-Bold.ttf
          weight: 700 
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
    