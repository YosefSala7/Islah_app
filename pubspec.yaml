name: app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  another_flutter_splash_screen: ^1.2.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/imgs/appIcon.png"
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/imgs/appIcon.png"

flutter:
  uses-material-design: true

  assets:
    - "assets/imgs/appIcon.png"